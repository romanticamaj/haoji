name: haoji

services:
  haoji-backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    ports:
      - "${WEB_PORT:-7780}:7780"
    environment:
      ASR_BASE_URL: http://breeze-asr:7765
      # *_DEFAULT seeds the value without locking it, so the console can switch models / point at
      # another Ollama. Setting the plain OLLAMA_BASE_URL / LLM_MODEL here would lock those fields.
      OLLAMA_BASE_URL_DEFAULT: http://ollama:11434
      LLM_MODEL_DEFAULT: ${LLM_MODEL:-gemma4:e4b-it-qat}
      DATA_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HAOJI_PUBLIC_URLS: ${HAOJI_PUBLIC_URLS:-}
      HAOJI_ALLOWED_HOSTS: ${HAOJI_ALLOWED_HOSTS:-}
      HAOJI_ADMIN_TOKEN: ${HAOJI_ADMIN_TOKEN:-}
      HAOJI_REQUIRE_TOKEN: ${HAOJI_REQUIRE_TOKEN:-0}
      HAOJI_RETENTION_HOURS: ${HAOJI_RETENTION_HOURS:-24}
      # Push "逐字稿完成" to the phone (APNs). Blank APNS_KEY_ID = push off; see DEPLOY.md §3.
      APNS_KEY_PATH: /secrets/apns.p8
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
    volumes:
      - data:/data
      - ./secrets:/secrets:ro
    depends_on:
      ollama:
        condition: service_started
      breeze-asr:
        condition: service_healthy
    restart: unless-stopped

  breeze-asr:
    # Deployers who received a pre-built image just `docker load` it and run
    # `docker compose up -d` (NO --build) — no HF token needed. Only image
    # BUILDERS need HF_TOKEN in .env (pyannote pre-bake), via `docker compose build`.
    image: haoji-breeze-asr:latest
    build:
      context: ./breeze-asr
      secrets:
        - hf_token
    environment:
      BREEZE_MODEL_PATH: /models/breeze-asr
    volumes:
      - models-breeze:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7765/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      # first boot may download ~3GB of weights before /health answers
      start_period: 30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/entrypoint.sh"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b-it-qat}
    volumes:
      - models-ollama:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  data:
  models-ollama:
  models-breeze:
    # Pre-seeded on the build box; on a fresh machine the first boot downloads
    # Breeze into it automatically (resumable).
    name: haoji-models-breeze
    external: false

secrets:
  hf_token:
    environment: HF_TOKEN
