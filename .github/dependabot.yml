version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /backend/console
    schedule: { interval: monthly }
  # app/ (React Native) is pinned deliberately — upgrade by hand against the RN release notes.
