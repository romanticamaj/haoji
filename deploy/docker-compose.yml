name: haoji

services:
  haoji-backend:
    build: ../backend
    ports:
      - "${WEB_PORT:-8780}:8780"
    environment:
      ASR_BASE_URL: http://breeze-asr:8765
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b-it-qat}
      DATA_DIR: /data
    volumes:
      - data:/data
    depends_on:
      - ollama
      - breeze-asr
    restart: unless-stopped

  breeze-asr:
    build:
      context: ./breeze-asr
      secrets:
        - hf_token
    environment:
      BREEZE_MODEL_PATH: /models/breeze-asr
    volumes:
      - models-breeze:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/entrypoint.sh"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b-it-qat}
    volumes:
      - models-ollama:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  data:
  models-ollama:
  models-breeze:
    # Pre-seeded on the build box; on a fresh machine the first boot downloads
    # Breeze into it automatically (resumable).
    name: haoji-models-breeze
    external: false

secrets:
  hf_token:
    environment: HF_TOKEN
